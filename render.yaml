services:
  - type: web
    name: darkbot
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: SESSION_SECRET
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard
      
      # AI Provider Keys
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      
      # URLs
      - key: FRONTEND_URL
        fromContext: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        fromContext: RENDER_EXTERNAL_URL
      
      # OAuth (Optional)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
